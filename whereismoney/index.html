<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8C1F18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="宝盒是怎样月光的：月收入、分期与支出的可用现金预测，提前看见月光红线" />
    <title>宝盒是怎样月光的</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%238C1F18'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z'/%3E%3Cpath d='m3.3 7 8.7 5 8.7-5'/%3E%3Cpath d='M12 22V12'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.cn" />
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap"
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="seal" aria-hidden="true">钱</span>
          <div class="brand-text">
            <strong>宝盒是怎样月光的</strong>
            <small>钱包还能挺多久</small>
          </div>
        </div>
        <div class="today-pill" id="todayPill"></div>
      </header>

      <main class="main">
        <section class="view is-active" id="view-overview" data-view="overview">
          <div id="heroWrap"></div>
          <div id="alertWrap"></div>
          <div id="guideWrap"></div>
          <div class="section-head" id="overviewHead"></div>
          <div class="month-list" id="monthList"></div>
          <div class="expand-wrap" id="expandWrap"></div>
        </section>

        <section class="view" id="view-query" data-view="query">
          <div class="card query-card overlap" id="queryCard"></div>
          <div id="queryResult"></div>
        </section>

        <section class="view" id="view-compare" data-view="compare">
          <div class="card overlap" id="comparePick"></div>
          <div class="card" id="compareAdd"></div>
          <div class="card" id="compareChart"></div>
          <div id="compareSummary"></div>
        </section>

        <section class="view" id="view-settings" data-view="settings">
          <div class="card overlap" id="baseCard"></div>
          <div class="card" id="instCard"></div>
          <div class="danger-zone" id="dangerZone"></div>
        </section>
      </main>

      <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
